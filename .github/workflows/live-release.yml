name: Resolve tested live release
on:
  workflow_call:
    outputs:
      revision:
        value: ${{ jobs.resolve.outputs.revision }}
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      revision: ${{ steps.live.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - id: live
        run: bun scripts/live-revision.ts
        env:
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_TOKEN: ${{ github.token }}
