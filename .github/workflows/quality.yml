name: Parser and delivery checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lacey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run build:vercel
      - name: Browser guard with live and unpublished catalogue rows
        env:
          BUN_CHROME_PATH: /usr/bin/google-chrome
        run: bun run smoke:ci
      - name: Postgres browser, subscriptions, sold-out checks and transactions
        env:
          LACEY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lacey_test
          BUN_CHROME_PATH: /usr/bin/google-chrome
        run: bun scripts/check-postgres.ts
      - name: Retain browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: screenshots/smoke-*.png
          retention-days: 7
          if-no-files-found: warn
