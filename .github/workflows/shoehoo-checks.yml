name: Lacey checks and digests
on:
  schedule:
    - cron: '0 8,20 * * *'
      timezone: 'Europe/Dublin'
    # A missed primary event can be caught without repeating a completed scan or digest.
    - cron: '15 8,20 * * *'
      timezone: 'Europe/Dublin'
  workflow_dispatch:
    inputs:
      catalogue_only:
        description: Refresh catalogue without sending emails
        type: boolean
        default: false
      resume_run_id:
        description: 'Catalogue-only recovery: resume an existing scan ID (optional)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  refresh-and-deliver:
    if: ${{ !inputs.catalogue_only }}
    concurrency:
      group: lacey-checks
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Refresh shops, deliver verified matches and back up
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CATALOGUE_ONLY: ${{ inputs.catalogue_only }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: bun run scan
      - name: Retain encrypted customer-data backup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lacey-backup-${{ github.run_id }}
          path: .data/backups/*.enc
          retention-days: 14
          if-no-files-found: warn
  catalogue:
    needs: refresh-and-deliver
    if: ${{ always() && (inputs.catalogue_only || needs.refresh-and-deliver.result == 'success') }}
    concurrency:
      group: lacey-catalogue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The worker stops after 90 minutes with its cursor intact. It cannot delay
    # the next slot's independent delivery job or bypass retailer rate limits.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Advance the checkpointed EU catalogue without email
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CATALOGUE_ONLY: 'true'
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: bun run scan
