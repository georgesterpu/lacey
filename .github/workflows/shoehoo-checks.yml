name: Lacey checks and digests
on:
  schedule:
    - cron: '0 8,20 * * *'
      timezone: 'Europe/Dublin'
    # A missed primary event can be caught without repeating a completed scan or digest.
    - cron: '15 8,20 * * *'
      timezone: 'Europe/Dublin'
  workflow_dispatch:
    inputs:
      catalogue_only:
        description: Refresh catalogue without sending emails
        type: boolean
        default: false
      resume_run_id:
        description: 'Catalogue-only recovery: resume an existing scan ID (optional)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: shoehoo-checks
  cancel-in-progress: false
jobs:
  refresh-and-deliver:
    runs-on: ubuntu-latest
    # The EU sale catalogue has around 2,500 products. Keep the polite 1 req/s
    # pace and allow time for all pages plus bounded retries.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Collect, validate, match, deliver and verify
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CATALOGUE_ONLY: ${{ inputs.catalogue_only }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: bun run scan
      - name: Retain encrypted customer-data backup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lacey-backup-${{ github.run_id }}
          path: .data/backups/*.enc
          retention-days: 14
          if-no-files-found: warn
