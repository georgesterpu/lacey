name: Retailer public-access diagnostic
on:
  workflow_dispatch:
    inputs:
      source:
        description: Retailer to check without database or email credentials
        type: choice
        options: [warehouse, sportsdirect, all, incident]
        default: warehouse
      product_url:
        description: Optional public Warehouse product to verify in the same country session
        type: string
        default: ''
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: ${{ inputs.source != 'incident' }}
        run: bun scripts/check-retailer-access.ts
        env:
          RETAILER_SOURCE: ${{ inputs.source }}
          RETAILER_PRODUCT_URL: ${{ inputs.product_url }}
      - if: ${{ inputs.source == 'incident' }}
        run: bun scripts/diagnose-retailers.ts
        env:
          BUN_CHROME_PATH: /usr/bin/google-chrome
