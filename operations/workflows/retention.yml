name: Catalogue retention
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
      timezone: Europe/Dublin
permissions:
  contents: read
  actions: read
concurrency:
  group: lacey-retention
  cancel-in-progress: false
jobs:
  live-release:
    uses: ./.github/workflows/live-release.yml
  prune:
    needs: live-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.LACEY_SOURCE_REPOSITORY }}
          ref: ${{ needs.live-release.outputs.revision }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Prune expired catalogue pages independently of collection and email
        env:
          LACEY_PG_DATABASE_URL: ${{ secrets.LACEY_PG_DATABASE_URL }}
        run: bun scripts/maintenance.ts
